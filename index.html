<!DOCTYPE html>
<lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TOMOCORE DS 完全版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DotGothic16&display=swap');

        * {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            background-color: #1a202c;
            font-family: 'DotGothic16', sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
            overflow-x: hidden;
        }

        /* DS Handheld Chassis */
        .ds-body {
            background: linear-gradient(145deg, #e6e6e6, #cccccc);
            border-radius: 28px;
            padding: 20px 16px;
            box-shadow: 
                0 20px 50px rgba(0,0,0,0.6),
                inset 0 2px 4px rgba(255,255,255,0.9),
                inset 0 -4px 8px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: 320px;
            max-width: 100vw;
            position: relative;
            border: 4px solid #b3b3b3;
        }

        .ds-screen-frame {
            background: #111;
            padding: 8px;
            border-radius: 12px;
            box-shadow: inset 0 0 12px #000, 0 2px 4px rgba(255,255,255,0.5);
            position: relative;
            width: 272px;
        }

        canvas {
            display: block;
            background-color: #000;
            border-radius: 4px;
            width: 256px;
            height: 192px;
            image-rendering: pixelated;
            margin: 0 auto;
        }

        .ds-hinge {
            width: 92%;
            height: 14px;
            background: linear-gradient(to bottom, #cfcfcf, #9e9e9e, #7a7a7a);
            border-radius: 7px;
            box-shadow: inset 0 1px 3px rgba(255,255,255,0.8), 0 2px 4px rgba(0,0,0,0.4);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 12px;
        }

        .ds-led {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: #00ff66;
            box-shadow: 0 0 6px #00ff66;
        }

        /* Controls Layout */
        .ds-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 4px 8px;
        }

        .dpad {
            position: relative;
            width: 84px;
            height: 84px;
        }

        .btn-d {
            position: absolute;
            background: #333;
            border: 1px solid #111;
            border-radius: 4px;
            box-shadow: 0 3px 0 #111, inset 0 1px 2px rgba(255,255,255,0.3);
            color: #aaa;
            font-size: 11px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            active: translateY(2px);
        }
        .btn-d:active { transform: translateY(2px); box-shadow: 0 1px 0 #111; }

        .btn-up { top: 0; left: 28px; width: 28px; height: 28px; }
        .btn-down { bottom: 0; left: 28px; width: 28px; height: 28px; }
        .btn-left { top: 28px; left: 0; width: 28px; height: 28px; }
        .btn-right { top: 28px; right: 0; width: 28px; height: 28px; }
        .dpad-center { position: absolute; top: 28px; left: 28px; width: 28px; height: 28px; background: #333; }

        .action-btns {
            position: relative;
            width: 84px;
            height: 84px;
        }

        .btn-a-group {
            position: absolute;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #d9534f;
            color: white;
            font-weight: bold;
            font-size: 11px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 3px 0 #8b0000, inset 0 1px 2px rgba(255,255,255,0.4);
            cursor: pointer;
        }
        .btn-a-group:active { transform: translateY(2px); box-shadow: 0 1px 0 #8b0000; }

        .btn-x { top: 0; left: 29px; background: #5bc0de; box-shadow: 0 3px 0 #269abc; }
        .btn-b { bottom: 0; left: 29px; background: #f0ad4e; box-shadow: 0 3px 0 #d58512; }
        .btn-y { top: 29px; left: 0; background: #5cb85c; box-shadow: 0 3px 0 #398439; }
        .btn-a { top: 29px; right: 0; background: #d9534f; box-shadow: 0 3px 0 #ac2925; }

        /* Notification Modal */
        #game-modal {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.75);
            z-index: 50;
            border-radius: 20px;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
            color: #fff;
            text-align: center;
        }

        #modal-box {
            background: #2d3748;
            border: 3px solid #ed8936;
            border-radius: 12px;
            padding: 16px;
            width: 85%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
        }

        /* Custom Scrollbars for Canvas UI */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #888; border-radius: 2px; }
    </style>
</head>
<body>

<div class="ds-body">
    <!-- Modal Dialog (Replaces alert) -->
    <div id="game-modal">
        <div id="modal-box">
            <h3 id="modal-title" class="text-amber-400 font-bold mb-2 text-sm">通知</h3>
            <p id="modal-text" class="text-xs mb-4 text-gray-200">メッセージ本文</p>
            <button id="modal-close-btn" class="bg-amber-500 hover:bg-amber-600 text-black px-4 py-1 rounded text-xs font-bold">OK</button>
        </div>
    </div>

    <!-- Top Screen -->
    <div class="ds-screen-frame">
        <canvas id="screen-top" width="256" height="192"></canvas>
    </div>

    <!-- Hinge with Power LED -->
    <div class="ds-hinge">
        <div class="text-[9px] text-gray-600 tracking-wider">TOMOCORE DUAL SCREEN</div>
        <div class="ds-led" id="power-led"></div>
    </div>

    <!-- Bottom Touch Screen -->
    <div class="ds-screen-frame">

        </div>

            <span class="text-[10px] text-gray-500 font-bold">MICROPHONE</span>
            <div class="w-3 h-3 rounded-full bg-gray-800 border border-gray-600"></div>
            <span class="text-[9px] text-gray-400 mt-2">SELECT / START</span>

            <div class="btn-a-group btn-b" id="btn-b">B</div>
            <div class="btn-a-group btn-a" id="btn-a">A</div>
        </div>
    </div>
</div>

<script>
// Audio Engine & Voice Synthesizer
const AudioEngine = {
    ctx: null,
    init() {
        if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (this.ctx.state === 'suspended') {
            this.ctx.resume();
        }
    },
    playTone(freq, type = 'sine', duration = 0.1, vol = 0.1) {
        this.init();
        try {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
            gain.gain.setValueAtTime(vol, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + duration);
        } catch(e){}
    },
    click() { this.playTone(800, 'sine', 0.05, 0.08); },
    select() { this.playTone(1200, 'square', 0.08, 0.08); },
    cancel() { this.playTone(250, 'sawtooth', 0.12, 0.1); },
    coin() {
        this.playTone(987, 'sine', 0.08, 0.1);
        setTimeout(() => this.playTone(1318, 'sine', 0.2, 0.12), 80);
    },
    fanfare() {
        const notes = [523, 659, 783, 1046];
        notes.forEach((n, i) => {
            setTimeout(() => this.playTone(n, 'triangle', 0.2, 0.12), i * 120);
        });
    }
};

// Web Speech API Mii Voice
function speakMii(text, pitch = 1.2, rate = 1.3) {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const ut = new SpeechSynthesisUtterance(text);
        ut.lang = 'ja-JP';
        ut.pitch = Math.max(0.5, Math.min(2.0, pitch / 50)); // Scale 0-100 to 0.5-2.0
        ut.rate = Math.max(0.8, Math.min(1.8, rate / 50));   // Scale 0-100 to 0.8-1.8
        window.speechSynthesis.speak(ut);
    } else {
        // Fallback tone speech effect
        for(let i=0; i<Math.min(text.length, 10); i++) {
            setTimeout(() => AudioEngine.playTone(400 + (text.charCodeAt(i)%300), 'square', 0.06), i*70);
        }
    }
}

const COLOR_PALETTES = {
    skin: ['#ffe0bd', '#ffcd94', '#eac086', '#ffad60', '#ffe39f', '#623d26'],
    hair: ['#1a1a1a', '#4a3018', '#c49a6c', '#ffd700', '#8b0000', '#2b5278', '#52782b', '#782b75'],
    cloth: ['#e53e3e', '#3182ce', '#38a169', '#d69e2e', '#805ad5', '#dd6b20', '#319795', '#4a5568']
};

class Resident {
    constructor(id, name, dna) {
        this.id = id;
        this.name = name || `トモダチ${id+1}`;
        this.room = id; // 0 to 99
        this.dna = dna || {
            hair: Math.floor(Math.random()*10),
            eye: Math.floor(Math.random()*10),
            eyebrow: Math.floor(Math.random()*5),
            nose: Math.floor(Math.random()*5),
            mouth: Math.floor(Math.random()*5),
            skinColor: Math.floor(Math.random()*COLOR_PALETTES.skin.length),
            hairColor: Math.floor(Math.random()*COLOR_PALETTES.hair.length),
            cloth: Math.floor(Math.random()*10),
            clothColor: Math.floor(Math.random()*COLOR_PALETTES.cloth.length),
            pitch: 50 + Math.floor(Math.random()*30),
            speed: 50 + Math.floor(Math.random()*30),
            height: 50,
            weight: 50
        };
        this.fullness = 60;
        this.happiness = 70;
        this.catchphrase = "よろしくね！";
    }
}

// Core Game Engine State
const Game = {

    frame: 0,
    residents: [],

};

for (let i = 0; i < 5; i++) {

    Game.residents.push(new Resident(i, names[i]));

// Modal Dialog Utility
function showModal(title, text, callback) {
    const modal = document.getElementById('game-modal');
    document.getElementById('modal-title').innerText = title;
    document.getElementById('modal-text').innerText = text;
    modal.style.display = 'flex';
    
    const closeBtn = document.getElementById('modal-close-btn');
    const handler = () => {
        modal.style.display = 'none';
        closeBtn.removeEventListener('click', handler);
        if(callback) callback();
    };
    closeBtn.addEventListener('click', handler);
}

// Canvas Touch Handler
function getTouchPos(canvas, evt) {
    const rect = canvas.getBoundingClientRect();
    const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
    const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
    return {
        x: Math.floor((clientX - rect.left) / (rect.width / 256)),
        y: Math.floor((clientY - rect.top) / (rect.height / 192))
    };
}

Game.bottomCanvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    AudioEngine.init();
    const pos = getTouchPos(Game.bottomCanvas, e);
    Game.input.tapped = true;
    Game.input.isDown = true;
    Game.input.x = pos.x;
    Game.input.y = pos.y;
});

Game.bottomCanvas.addEventListener('pointermove', (e) => {
    if(Game.input.isDown) {
        const pos = getTouchPos(Game.bottomCanvas, e);
        Game.input.x = pos.x;
        Game.input.y = pos.y;
    }
});

window.addEventListener('pointerup', () => {
    Game.input.isDown = false;
});

// Setup Virtual Button Inputs
const btnMapping = [
    ['btn-up', 'up'], ['btn-down', 'down'], ['btn-left', 'left'], ['btn-right', 'right'],
    ['btn-a', 'a'], ['btn-b', 'b'], ['btn-x', 'x'], ['btn-y', 'y']
];

btnMapping.forEach(([elemId, key]) => {
    const el = document.getElementById(elemId);
    if(el) {
        el.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            AudioEngine.init();
            Game.input.keys[key] = true;
            if(key === 'a') Game.input.justPressed.a = true;
            if(key === 'b') Game.input.justPressed.b = true;
        });
        el.addEventListener('pointerup', () => { Game.input.keys[key] = false; });
        el.addEventListener('pointerleave', () => { Game.input.keys[key] = false; });
    }
});

// Graphic Helper Functions
function fill(ctx, col) { ctx.fillStyle = col; ctx.fillRect(0, 0, 256, 192); }

function drawText(ctx, str, x, y, size = 11, col = '#000', align = 'left') {
    ctx.fillStyle = col;
    ctx.font = `${size}px 'DotGothic16'`;
    ctx.textAlign = align;
    ctx.fillText(str, x, y);
}

function drawRect(ctx, x, y, w, h, col, borderCol = null) {
    ctx.fillStyle = col;
    ctx.fillRect(x, y, w, h);
    if(borderCol) {
        ctx.strokeStyle = borderCol;
        ctx.strokeRect(x, y, w, h);
    }
}

function drawButton(ctx, x, y, w, h, label, bgCol = '#edf2f7', textCol = '#2d3748') {
    ctx.fillStyle = bgCol;
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = '#4a5568';
    ctx.strokeRect(x, y, w, h);
    
    // Highlight top border
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.fillRect(x, y, w, 2);

    drawText(ctx, label, x + w / 2, y + h / 2 + 4, 11, textCol, 'center');

    // Tap detection
    if(Game.input.tapped && Game.input.x >= x && Game.input.x <= x + w && Game.input.y >= y && Game.input.y <= y + h) {
        Game.input.tapped = false;
        AudioEngine.click();
        return true;
    }
    return false;
}

// Parametric Mii Rendering Algorithm (50+ combinations per part)
function drawMii(ctx, dna, x, y, scale = 1.0) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);

    const skinCol = COLOR_PALETTES.skin[dna.skinColor % COLOR_PALETTES.skin.length];
    const hairCol = COLOR_PALETTES.hair[dna.hairColor % COLOR_PALETTES.hair.length];
    const clothCol = COLOR_PALETTES.cloth[dna.clothColor % COLOR_PALETTES.cloth.length];

    // Body Clothes
    ctx.fillStyle = clothCol;
    ctx.beginPath();
    ctx.arc(0, 38, 22, Math.PI, 0);
    ctx.fill();

    // Head Base
    ctx.fillStyle = skinCol;
    ctx.beginPath();
    ctx.ellipse(0, 0, 24, 28, 0, 0, Math.PI * 2);
    ctx.fill();

    // Hair Style Variations
    ctx.fillStyle = hairCol;
    const hStyle = dna.hair % 10;
    ctx.beginPath();
    if (hStyle === 0) { // Short crop
        ctx.arc(0, -8, 25, Math.PI, 0);
    } else if (hStyle === 1) { // Spiky hair
        ctx.arc(0, -6, 25, Math.PI, 0);
        for(let i = -20; i <= 20; i += 8) {
            ctx.lineTo(i, -32);
        }
    } else if (hStyle === 2) { // Long Bob
        ctx.arc(0, -6, 26, Math.PI, 0);
        ctx.rect(-26, -6, 8, 38);
        ctx.rect(18, -6, 8, 38);
    } else if (hStyle === 3) { // Afro / Curly
        ctx.arc(0, -12, 32, 0, Math.PI * 2);
    } else if (hStyle === 4) { // Twin tails
        ctx.arc(0, -10, 25, Math.PI, 0);
        ctx.arc(-26, 0, 10, 0, Math.PI * 2);
        ctx.arc(26, 0, 10, 0, Math.PI * 2);
    } else if (hStyle === 5) { // Topknot / Bun
        ctx.arc(0, -8, 25, Math.PI, 0);
        ctx.arc(0, -32, 10, 0, Math.PI * 2);
    } else if (hStyle === 6) { // Side Bangs
        ctx.arc(0, -8, 25, Math.PI, 0);
        ctx.ellipse(-12, -4, 12, 20, 0.3, 0, Math.PI * 2);
    } else { // Cap / Helmet
        ctx.arc(0, -6, 26, Math.PI, 0);
        ctx.fillRect(-28, -8, 56, 6);
    }
    ctx.fill();

    // Eyebrows
    ctx.strokeStyle = hairCol;
    ctx.lineWidth = 2;
    const ebY = -12;
    ctx.beginPath();
    ctx.moveTo(-16, ebY); ctx.lineTo(-6, ebY - (dna.eyebrow % 3));
    ctx.moveTo(6, ebY - (dna.eyebrow % 3)); ctx.lineTo(16, ebY);
    ctx.stroke();

    // Eyes
    ctx.fillStyle = '#000';
    ctx.strokeStyle = '#000';
    const eStyle = dna.eye % 10;
    const eyeY = -2;
    if (eStyle === 0) { // Simple Dots
        ctx.beginPath(); ctx.arc(-10, eyeY, 3, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(10, eyeY, 3, 0, Math.PI*2); ctx.fill();
    } else if (eStyle === 1) { // Anime sparkles
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.ellipse(-10, eyeY, 5, 7, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.ellipse(10, eyeY, 5, 7, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#000';
        ctx.beginPath(); ctx.arc(-10, eyeY, 3, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(10, eyeY, 3, 0, Math.PI*2); ctx.fill();
    } else { // Happy Arcs
        ctx.beginPath(); ctx.arc(-10, eyeY, 4, Math.PI, 0); ctx.stroke();
        ctx.beginPath(); ctx.arc(10, eyeY, 4, Math.PI, 0); ctx.stroke();
    }

    // Nose
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(0, 6 + (dna.nose % 3), 2, 0, Math.PI);
    ctx.stroke();

    // Mouth
    const mStyle = dna.mouth % 5;
    const mouthY = 16;
    ctx.beginPath();
    if (mStyle === 0) { // Smile
        ctx.arc(0, mouthY - 3, 6, 0, Math.PI);
    } else if (mStyle === 1) { // Open mouth
        ctx.fillStyle = '#e53e3e';
        ctx.ellipse(0, mouthY, 5, 3, 0, 0, Math.PI*2);
        ctx.fill();
    } else { // Straight line
        ctx.moveTo(-6, mouthY); ctx.lineTo(6, mouthY);
    }
    ctx.stroke();

    ctx.restore();
}

// Weather System Engine
function updateWeather() {
    if (Game.weather !== 'SUNNY' && Math.random() < 0.3) {
        Game.weatherParticles.push({
            x: Math.random() * 256,
            y: -10,
            speed: Game.weather === 'RAIN' ? 6 : 1.5,
            size: Game.weather === 'SAKURA' ? 3 : (Game.weather === 'SNOW' ? 2 : 1)
        });
    }

    Game.weatherParticles.forEach(p => {
        p.y += p.speed;
        if(Game.weather === 'RAIN') p.x -= 1;
        if(Game.weather === 'SAKURA') p.x += Math.sin(Game.frame * 0.05);
    });

    Game.weatherParticles = Game.weatherParticles.filter(p => p.y < 192);
}

function drawBackgroundSky(ctx) {
    let grad = ctx.createLinearGradient(0, 0, 0, 192);
    if (Game.weather === 'SUNNY') {
        grad.addColorStop(0, '#63b3ed'); grad.addColorStop(1, '#ebf8ff');
    } else if (Game.weather === 'RAIN') {
        grad.addColorStop(0, '#4a5568'); grad.addColorStop(1, '#a0aec0');
    } else if (Game.weather === 'SNOW') {
        grad.addColorStop(0, '#2b6cb0'); grad.addColorStop(1, '#e2e8f0');
    } else { // SAKURA
        grad.addColorStop(0, '#fbb6ce'); grad.addColorStop(1, '#fff5f7');
    }
    fill(ctx, grad);

    // Weather Particles Render
    Game.weatherParticles.forEach(p => {
        if (Game.weather === 'RAIN') {
            drawRect(ctx, p.x, p.y, 1, 6, '#bee3f8');
        } else if (Game.weather === 'SAKURA') {
            ctx.fillStyle = '#fbb6ce';
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
        } else {
            ctx.fillStyle = '#ffffff';
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
        }
    });
}

// Local Storage Manager
function saveGameData() {
    try {
        const payload = {
            money: Game.money,
            inventory: Game.inventory,
            residents: Game.residents,
            weather: Game.weather
        };
        localStorage.setItem('tomocore_ds_save', JSON.stringify(payload));
        AudioEngine.coin();
        showModal("セーブ完了", "ゲームデータを本体メモリーに保存しました！");
    } catch(e) {
        showModal("エラー", "セーブに失敗しました。");
    }
}

function loadGameData() {
    try {
        const raw = localStorage.getItem('tomocore_ds_save');
        if (raw) {
            const data = JSON.parse(raw);
            Game.money = data.money;
            Game.inventory = data.inventory || [];
            Game.weather = data.weather || 'SUNNY';
            Game.residents = data.residents.map(r => {
                let res = new Resident(r.id, r.name, r.dna);
                res.fullness = r.fullness;
                res.happiness = r.happiness;
                return res;
            });
            AudioEngine.select();
            showModal("ロード成功", "セーブデータを読み込みました！");
        } else {
            showModal("通知", "セーブデータが見つかりません。");
        }
    } catch(e) {
        showModal("エラー", "ロードに失敗しました。");
    }
}

// SCENE: 100-ROOM APARTMENT
function sceneApartment() {
    drawBackgroundSky(Game.topCtx);
    drawText(Game.topCtx, "100室 マンション", 128, 20, 16, '#2d3748', 'center');
    drawText(Game.topCtx, `全100部屋中 ${Game.residents.length}室 入居中`, 128, 40, 11, '#4a5568', 'center');

    fill(Game.bottomCtx, '#2d3748');

    const pageSize = 20; // 20 rooms per page (5 pages total = 100)
    const startIdx = Game.subPage * pageSize;

    for (let i = 0; i < pageSize; i++) {
        const roomNum = startIdx + i;
        const col = i % 5;
        const row = Math.floor(i / 5);
        const rx = 10 + col * 48;
        const ry = 10 + row * 34;

        const inhabitant = Game.residents.find(r => r.room === roomNum);

        drawRect(Game.bottomCtx, rx, ry, 44, 30, inhabitant ? '#feebc8' : '#4a5568', '#718096');
        drawText(Game.bottomCtx, `${roomNum + 1}`, rx + 3, ry + 10, 9, inhabitant ? '#744210' : '#a0aec0');

        if (inhabitant) {
            drawText(Game.bottomCtx, inhabitant.name.substring(0, 3), rx + 22, ry + 22, 10, '#2b6cb0', 'center');
        }

        if (Game.input.tapped && Game.input.x >= rx && Game.input.x <= rx + 44 && Game.input.y >= ry && Game.input.y <= ry + 30) {
            Game.input.tapped = false;
            AudioEngine.select();
            if (inhabitant) {
                Game.selectedResident = inhabitant;
                Game.scene = 'ROOM';
                speakMii(`やあ！${inhabitant.name}の部屋へようこそ！`, inhabitant.dna.pitch, inhabitant.dna.speed);
            } else {
                showModal("空き部屋", "この部屋は空室です。市役所で新しい住人を登録できます！");
            }
        }
    }

    // Page Controls
    if (drawButton(Game.bottomCtx, 10, 155, 50, 25, '◀ 前へ')) {
        if (Game.subPage > 0) Game.subPage--;
    }
    drawText(Game.bottomCtx, `${Game.subPage + 1} / 5 階`, 128, 172, 11, '#fff', 'center');
    if (drawButton(Game.bottomCtx, 196, 155, 50, 25, '次へ ▶')) {

    if (drawButton(Game.bottomCtx, 100, 155, 56, 25, 'マップ', '#e2e8f0')) Game.scene = 'MAP';
}

function sceneMinigame() {

    fill(Game.bottomCtx, '#edf2f7');

    if (!Game.temp.rhythm) {
        Game.temp.rhythm = { score: 0, combo: 0, noteY: -20, active: false };
    }
    const r = Game.temp.rhythm;

    if (!r.active) {
        drawText(Game.bottomCtx, "「トモリズム」に挑戦！", 128, 50, 13, '#2d3748', 'center');
        if (drawButton(Game.bottomCtx, 78, 80, 100, 36, 'スタート！', '#48bb78')) {
            r.active = true;
            r.score = 0;
            r.noteY = 0;
        }
    } else {
        // Rhythm Game Loop
        r.noteY += 3;
        if (r.noteY > 180) {
            r.noteY = -20;
        }

        drawRect(Game.bottomCtx, 108, r.noteY, 40, 15, '#e53e3e'); // Falling Note
        drawRect(Game.bottomCtx, 98, 140, 60, 20, '#4299e1', '#2b6cb0'); // Hit Zone

        drawText(Game.topCtx, `SCORE: ${r.score}`, 128, 100, 18, '#f6e05e', 'center');

        if (drawButton(Game.bottomCtx, 98, 140, 60, 25, 'PUSH!', '#ecc94b')) {
            if (r.noteY >= 120 && r.noteY <= 160) {
                r.score += 100;
                Game.money += 50;
                AudioEngine.coin();
                r.noteY = -20;
            } else {
                AudioEngine.cancel();
            }
        }
    }

    if (drawButton(Game.bottomCtx, 180, 160, 60, 25, 'マップ', '#cbd5e0')) {
        delete Game.temp.rhythm;
        Game.scene = 'MAP';
    }
}

// Main Game Loop Engine
function gameLoop() {
    Game.frame++;
    updateWeather();

    // Clear Canvas Screens
    Game.topCtx.clearRect(0, 0, 256, 192);
    Game.bottomCtx.clearRect(0, 0, 256, 192);

    // Scene Router
    switch (Game.scene) {
        case 'TITLE': sceneTitle(); break;
        case 'MAP': sceneMap(); break;
        case 'APARTMENT': sceneApartment(); break;
        case 'ROOM': sceneRoom(); break;
        case 'CHARACTER_CREATOR': sceneCharacterCreator(); break;
        case 'SHOP': sceneShop(); break;
        case 'DRESSUP': sceneDressup(); break;
        case 'CITY_HALL': sceneCityHall(); break;
        case 'SHRINE': sceneShrine(); break;
        case 'CANVAS': sceneCanvas(); break;
        case 'LIVE': sceneLive(); break;
        case 'MINIGAME': sceneMinigame(); break;
    }

    // Reset single-frame inputs
    Game.input.justPressed.a = false;
    Game.input.justPressed.b = false;

    requestAnimationFrame(gameLoop);
}

// Start Game
requestAnimationFrame(gameLoop);
</script>
